name: Deploy to Production

on:
  push:
    branches: [ production ]

jobs:
  run-linters:
    name: Run Python linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run Flake8 (Checks for style issues)
        run: flake8 .

      - name: Black Autoformat
        run: black .

      - name: Run Black (Code formatting check)
        run: black --check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: run-linters
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run tests on the main API
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          API_ENDPOINT: "https://2vyhl58mci.execute-api.ap-southeast-2.amazonaws.com/prod/get-upload-url?file=test.csv"
          COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
        run: |
          python tests/test-api.py

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install zip tool
        run: sudo apt-get install -y zip

      - name: Deploy Upload Function to Production
        run: |
          cd lambda_functions/uploadRawCSV
          zip -r ../../uploadRawCSV.zip .
          aws lambda update-function-code \
            --function-name arn:aws:lambda:ap-southeast-2:992382806042:function:collectionFunction \
            --zip-file fileb://../../uploadRawCSV.zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "ap-southeast-2"

      - name: Deploy Raw to Processed CSV Function to Production
        run: |
          cd lambda_functions/rawToProcessedCSV
          zip -r ../../rawToProcessedCSV.zip .
          aws lambda update-function-code \
            --function-name arn:aws:lambda:ap-southeast-2:992382806042:function:CSVtoLambda \
            --zip-file fileb://../../rawToProcessedCSV.zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "ap-southeast-2"

      - name: Deploy Processed CSV to JSON Function to Production
        run: |
          cd lambda_functions/csvToJson
          zip -r ../../csvToJson.zip .
          aws lambda update-function-code \
            --function-name arn:aws:lambda:ap-southeast-2:992382806042:function:SortedCSVtoJSON \
            --zip-file fileb://../../csvToJson.zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "ap-southeast-2"